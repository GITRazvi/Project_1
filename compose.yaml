services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud_notes
      POSTGRES_USER: cloud_notes
      POSTGRES_PASSWORD: cloud_notes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_notes -d cloud_notes"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev --workspace=@cloud-learning/api
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://cloud_notes:cloud_notes@db:5432/cloud_notes
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:3001/api/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev --workspace=@cloud-learning/web
    environment:
      API_PROXY_TARGET: http://api:3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  node_modules:
  postgres_data:

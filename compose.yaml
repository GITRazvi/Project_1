services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev --workspace=@cloud-learning/api
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:3001/api/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev --workspace=@cloud-learning/web
    environment:
      API_PROXY_TARGET: http://api:3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  node_modules:

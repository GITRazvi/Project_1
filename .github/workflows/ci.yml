name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloud_notes_test
          POSTGRES_USER: cloud_notes
          POSTGRES_PASSWORD: cloud_notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud_notes -d cloud_notes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cloud_notes:cloud_notes@127.0.0.1:5432/cloud_notes_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build applications
        run: npm run build

      - name: Run test suites
        run: npm test
